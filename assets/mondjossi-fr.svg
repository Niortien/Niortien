<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Projet phare : Mon Djossi, la caisse et le stock des boutiques ivoiriennes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset=".55" stop-color="#2e1065"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="2" y="2" width="836" height="146" rx="22"/></clipPath>
  </defs>
  <style>
    .eyebrow { font: 700 15px 'Segoe UI', Ubuntu, Arial, sans-serif; letter-spacing: 3px; fill: #fbbf24; }
    .name { font: 800 52px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: url(#brand); }
    .sub { font: 500 19px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #c4b5fd; }
    .shine { animation: sweep 4.5s ease-in-out infinite; }
    .border { animation: pulse 3s ease-in-out infinite; }
    .star { transform-origin: 46px 38px; animation: spin 6s linear infinite; }
    .cart { animation: drive 2.4s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-420px); } 60%, 100% { transform: translateX(900px); } }
    @keyframes pulse { 0%, 100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drive { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
    @media (prefers-reduced-motion: reduce) { .shine, .border, .star, .cart { animation: none; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="840" height="150" fill="url(#bg)"/>
    <rect class="shine" x="0" y="-40" width="260" height="230" fill="url(#shine)" transform="skewX(-20)"/>
  </g>
  <rect class="border" x="2" y="2" width="836" height="146" rx="22" fill="none" stroke="url(#brand)" stroke-width="3"/>
  <path class="star" d="M46 28l3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.6-6.2 3.6 1.4-7-5.2-4.8 7-.8z" fill="#fbbf24"/>
  <text class="eyebrow" x="66" y="44">PROJET PHARE · EN LIGNE</text>
  <text class="name" x="34" y="100">Mon Djossi</text>
  <text class="sub" x="36" y="130">La caisse et le stock des boutiques ivoiriennes, même sans internet.</text>
  <g class="cart" transform="translate(690 52)" fill="url(#brand)">
    <path d="M14 6h12l3 4h66c4 0 6 3 5 7l-9 33c-1 3-3 5-7 5H40c-3 0-6-2-7-5L22 14h-8c-3 0-5-2-5-4s2-4 5-4z"/>
    <circle cx="44" cy="70" r="8"/><circle cx="80" cy="70" r="8"/>
    <rect x="-28" y="20" width="34" height="7" rx="3.5" opacity=".75"/><rect x="-40" y="33" width="30" height="7" rx="3.5" opacity=".6"/><rect x="-24" y="46" width="26" height="7" rx="3.5" opacity=".45"/>
  </g>
</svg>
